[project]
name = "osiki-sdk"
version = "0.1.0"
description = "Python SDK for Osiki: local RBAC decisions from a cached snapshot."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Benson Osei Mensah", email = "kbenson643@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "starlette>=0.37",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2"]

[tool.poetry]
packages = [{include = "osiki_sdk", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
pytest-cov = ">=6.0"
mypy = ">=1.19"
ruff = ">=0.14"
black = ">=25.1"
fastapi = ">=0.115"
sqlalchemy = ">=2"
mongomock-motor = ">=0.0.34"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "src/osiki_sdk/_decision/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/osiki_sdk/_decision"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["src/osiki_sdk/_decision/*"]

[tool.coverage.report]
fail_under = 100
