name: SDK

on:
  pull_request:
    branches: [main]
    paths:
      - "sdks/**"
      - "osiki/decision/**"
      - "conformance/**"
      - "scripts/sync_sdk_decision.py"
      - ".github/workflows/sdk.yml"

jobs:
  sdk:
    name: SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the vendored decision core is in sync
        run: python scripts/sync_sdk_decision.py --check
        working-directory: .

      - name: Install Poetry
        run: pip install poetry
        shell: bash

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-sdk-${{ matrix.python-version }}-${{ hashFiles('sdks/python/poetry.lock') }}
          restore-keys: poetry-sdk-${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting (Black)
        run: poetry run black --check .

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Type check (MyPy)
        run: poetry run mypy src

      - name: Run tests with coverage
        run: poetry run pytest --cov=osiki_sdk --cov-report=term-missing
